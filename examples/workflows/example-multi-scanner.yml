name: SecScore PR

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secscore:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Necessário para diff-aware: busca histórico completo
        fetch-depth: 0

    - name: Run Semgrep
      run: semgrep --sarif --output semgrep.sarif

    - name: Run Trivy
      run: trivy fs --format sarif -o trivy.sarif .

    # v0.3.0 — múltiplos SARIFs passados diretamente, sem jq
    - name: Run SecScore
      uses: cassiodeveloper/secscore@v1
      with:
        sarif: "semgrep.sarif,trivy.sarif"
        # diff-aware ativo por padrão — para desativar:
        # no_diff_aware: "true"
