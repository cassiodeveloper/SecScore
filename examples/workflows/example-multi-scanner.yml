name: SecScore Multi-Scanner PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secscore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: semgrep --sarif --output semgrep.sarif

      - name: Run Trivy
        run: trivy fs --format sarif -o trivy.sarif .

      - name: Run SecScore
        uses: cassiodeveloper/secscore@v1
        with:
          sarif: "semgrep.sarif,trivy.sarif"
          # Optional M.A.R.I.A submission:
          # maria-url: ${{ secrets.MARIA_URL }}
          # maria-repository-id: ${{ secrets.MARIA_REPOSITORY_ID }}
          # maria-token: ${{ secrets.MARIA_TOKEN }}

