name: "SecScore"
description: "Security scoring engine for CI/CD pipelines. Convert SARIF findings into a single score and security decision."
author: "Cássio B. Pereira a.k.a. @cassiodeveloper"
branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  findings:
    description: "Path to findings.json (generated by your scanners/normalizers)"
    required: false
  policy:
    description: "Path to SecScore policy YAML"
    required: false
    default: policy/policy-default.yml
  sarif:
    description: >
      Path to one or more SARIF files. Accepts a single path or a comma-separated list of paths. Example: "semgrep.sarif,trivy.sarif"
    required: false
  no_diff_aware:
    description: "Set to 'true' to disable diff-aware filtering (enabled by default)"
    required: false
    default: "false"
  base_ref:
    description: "Git ref to diff against for diff-aware filtering (default: origin/main)"
    required: false
    default: "origin/main"
  label_review:
    description: "Label to apply when decision is REVIEW"
    required: false
    default: "secscore-review"
  check_name:
    description: "Name of the GitHub Check Run"
    required: false
    default: "SecScore"
  provider:
    description: "Provider name for context (e.g. 'checkmarx', 'snyk')"
    required: false
  checkmarx-project:
    description: "Checkmarx project name for context"
    required: false
  checkmarx-base-url:
    description: "Checkmarx base URL for context"
    required: false
  checkmarx-token:
    description: "Checkmarx token for context"
    required: false
  checkmarx-tenant:
    description: "Checkmarx tenant for provider mode"
    required: false
  token:
    description: "Generic token for integrations (used by M.A.R.I.A)"
    required: false
  maria-url:
    description: "M.A.R.I.A API endpoint URL to receive consolidated findings"
    required: false
  maria-token:
    description: "M.A.R.I.A bearer token (overrides token)"
    required: false
  maria-import-policy:
    description: "Set to 'true' or 'false' to control M.A.R.I.A policy import behavior"
    required: false
  maria-repository-id:
    description: "M.A.R.I.A repository id (GUID) for submissions endpoint"
    required: false
  maria-pull-request-id:
    description: "Pull request id to send to M.A.R.I.A (auto-detected in GitHub pull_request events when omitted)"
    required: false
  branch:
    description: "Branch name for context"
    required: false
  html_output:
    description: "Set to 'true' to generate secscore-report.html from secscore-result.json"
    required: false
    default: "false"
  html_out:
    description: "Path to the generated HTML report"
    required: false
    default: "secscore-report.html"

outputs:
  decision:
    description: "PASS | REVIEW | FAIL"
    value: ${{ steps.read_result.outputs.decision }}
  score:
    description: "0-100 score"
    value: ${{ steps.read_result.outputs.score }}
  exit_code:
    description: "0=PASS, 1=REVIEW, 2=FAIL"
    value: ${{ steps.secscore.outputs.exit_code }}

runs:
  using: "composite"
  steps:
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install SecScore (from this action repo)
    shell: bash
    run: |
      python -m pip install --upgrade pip
      pip install -r "${GITHUB_ACTION_PATH}/requirements.txt"
      pip install -e "${GITHUB_ACTION_PATH}"

  - name: Run SecScore
    id: secscore
    shell: bash
    env:
      INPUT_POLICY: ${{ inputs.policy }}
      INPUT_SARIF: ${{ inputs.sarif }}
      INPUT_FINDINGS: ${{ inputs.findings }}
      INPUT_PROVIDER: ${{ inputs.provider }}
      INPUT_NO_DIFF_AWARE: ${{ inputs.no_diff_aware }}
      INPUT_BASE_REF: ${{ inputs.base_ref }}
      INPUT_BRANCH: ${{ inputs.branch }}
      GITHUB_HEAD_REF_VALUE: ${{ github.head_ref }}
      INPUT_HTML_OUTPUT: ${{ inputs.html_output }}
      INPUT_HTML_OUT: ${{ inputs.html_out }}
      INPUT_CHECKMARX_PROJECT: ${{ inputs.checkmarx-project }}
      INPUT_CHECKMARX_BASE_URL: ${{ inputs.checkmarx-base-url }}
      INPUT_CHECKMARX_TOKEN: ${{ inputs.checkmarx-token }}
      INPUT_CHECKMARX_TENANT: ${{ inputs.checkmarx-tenant }}
      INPUT_TOKEN: ${{ inputs.token }}
      INPUT_MARIA_URL: ${{ inputs.maria-url }}
      INPUT_MARIA_TOKEN: ${{ inputs.maria-token }}
      INPUT_MARIA_IMPORT_POLICY: ${{ inputs.maria-import-policy }}
      INPUT_MARIA_REPOSITORY_ID: ${{ inputs.maria-repository-id }}
      INPUT_MARIA_PULL_REQUEST_ID: ${{ inputs.maria-pull-request-id }}
      GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    run: |
      POLICY_PATH="${INPUT_POLICY}"
      if [ -z "$POLICY_PATH" ]; then
        POLICY_PATH="${GITHUB_ACTION_PATH}/policy/policy-default.yml"
        echo "Using default policy from action"
      else
        echo "Using custom policy: $POLICY_PATH"
      fi

      # Monta argumento --sarif (pode ser lista separada por vÃ­rgula)
      args=()
      if [ -n "${INPUT_SARIF}" ]; then
        args+=(--sarif "${INPUT_SARIF}")
      fi
      if [ -n "${INPUT_FINDINGS}" ]; then
        args+=(--findings "${INPUT_FINDINGS}")
      fi
      if [ -n "${INPUT_PROVIDER}" ]; then
        args+=(--provider "${INPUT_PROVIDER}")
      fi

      # Diff-aware opt-out
      if [ "${INPUT_NO_DIFF_AWARE}" = "true" ]; then
        args+=(--no-diff-aware)
      fi

      # Base ref
      if [ -n "${INPUT_BASE_REF}" ]; then
        args+=(--base-ref "${INPUT_BASE_REF}")
      fi

      if [ -n "${INPUT_BRANCH}" ]; then
        args+=(--branch "${INPUT_BRANCH}")
      elif [ -n "${GITHUB_HEAD_REF_VALUE}" ]; then
        args+=(--branch "${GITHUB_HEAD_REF_VALUE}")
      fi

      if [ "${INPUT_HTML_OUTPUT}" = "true" ]; then
        args+=(--html-output true)
      fi

      if [ -n "${INPUT_HTML_OUT}" ]; then
        args+=(--html-out "${INPUT_HTML_OUT}")
      fi

      if [ -n "${INPUT_CHECKMARX_PROJECT}" ]; then
        args+=(--checkmarx-project "${INPUT_CHECKMARX_PROJECT}")
      fi

      if [ -n "${INPUT_CHECKMARX_BASE_URL}" ]; then
        args+=(--checkmarx-base-url "${INPUT_CHECKMARX_BASE_URL}")
      fi

      if [ -n "${INPUT_CHECKMARX_TOKEN}" ]; then
        args+=(--checkmarx-token "${INPUT_CHECKMARX_TOKEN}")
      fi

      # Generic token integration argument
      if [ -n "${INPUT_TOKEN}" ]; then
        args+=(--token "${INPUT_TOKEN}")
      fi

      # M.A.R.I.A integration arguments
      if [ -n "${INPUT_MARIA_URL}" ]; then
        args+=(--maria-url "${INPUT_MARIA_URL}")
      fi

      if [ -n "${INPUT_MARIA_TOKEN}" ]; then
        args+=(--maria-token "${INPUT_MARIA_TOKEN}")
      fi

      if [ -n "${INPUT_MARIA_IMPORT_POLICY}" ]; then
        args+=(--maria-import-policy "${INPUT_MARIA_IMPORT_POLICY}")
      fi

      if [ -n "${INPUT_MARIA_REPOSITORY_ID}" ]; then
        args+=(--maria-repository-id "${INPUT_MARIA_REPOSITORY_ID}")
      fi

      if [ -n "${INPUT_MARIA_PULL_REQUEST_ID}" ]; then
        args+=(--maria-pull-request-id "${INPUT_MARIA_PULL_REQUEST_ID}")
      elif [ -n "${GITHUB_PULL_REQUEST_NUMBER}" ]; then
        args+=(--maria-pull-request-id "${GITHUB_PULL_REQUEST_NUMBER}")
      fi

      if [ -n "${INPUT_CHECKMARX_TENANT}" ]; then
        args+=(--checkmarx-tenant "${INPUT_CHECKMARX_TENANT}")
      fi

      set +e
      python3 -m secscore.cli.main pr \
        "${args[@]}" \
        --policy "$POLICY_PATH" \
        --out pr-comment.md \
        --json-out secscore-result.json

      code=$?
      echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      exit 0

  - name: Read SecScore result
    id: read_result
    shell: bash
    run: |
      python3 - << 'PY'
      import json, os, sys
      path = "secscore-result.json"
      if not os.path.exists(path):
          print("decision=FAIL")
          print("score=0")
          sys.exit(0)
      data = json.load(open(path, "r", encoding="utf-8"))
      print(f"decision={data.get('decision','FAIL')}")
      print(f"score={data.get('score',0)}")
      PY >> "$GITHUB_OUTPUT"

  - name: Label PR based on SecScore
    if: ${{ always() }}
    uses: actions/github-script@v7
    env:
      LABEL_REVIEW: ${{ inputs.label_review }}
    with:
      script: |
        const fs = require('fs');
        const label = process.env.LABEL_REVIEW;

        if (!fs.existsSync('secscore-result.json')) return;

        const result = JSON.parse(fs.readFileSync('secscore-result.json', 'utf8'));
        const issue  = await github.rest.issues.get({
          owner: context.repo.owner,
          repo:  context.repo.repo,
          issue_number: context.issue.number
        });

        const hasLabel = issue.data.labels.some(l => l.name === label);

        if (result.decision === 'REVIEW' && !hasLabel) {
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo:  context.repo.repo,
            issue_number: context.issue.number,
            labels: [label]
          });
        }

        if (result.decision !== 'REVIEW' && hasLabel) {
          await github.rest.issues.removeLabel({
            owner: context.repo.owner,
            repo:  context.repo.repo,
            issue_number: context.issue.number,
            name: label
          });
        }

  - name: Create SecScore status check
    if: ${{ always() }}
    uses: actions/github-script@v7
    env:
      CHECK_NAME: ${{ inputs.check_name }}
    with:
      script: |
        const fs = require('fs');
        const checkName = process.env.CHECK_NAME;

        if (!fs.existsSync('secscore-result.json')) {
          await github.rest.checks.create({
            owner:    context.repo.owner,
            repo:     context.repo.repo,
            name:     checkName,
            head_sha: context.payload.pull_request.head.sha,
            status:   'completed',
            conclusion: 'failure',
            output: {
              title:   `${checkName} FAIL`,
              summary: 'SecScore did not produce secscore-result.json'
            }
          });
          return;
        }

        const result  = JSON.parse(fs.readFileSync('secscore-result.json', 'utf8'));
        const summary = fs.existsSync('pr-comment.md')
          ? fs.readFileSync('pr-comment.md', 'utf8')
          : `${checkName} ${result.decision} â€” Score ${result.score}/100`;

        const conclusion =
          result.decision === 'PASS'   ? 'success' :
          result.decision === 'REVIEW' ? 'success' :
          'failure';

        await github.rest.checks.create({
          owner:    context.repo.owner,
          repo:     context.repo.repo,
          name:     checkName,
          head_sha: context.payload.pull_request.head.sha,
          status:   'completed',
          conclusion,
          output: {
            title:   `${checkName} ${result.decision}`,
            summary
          }
        });

  - name: Publish PR comment (upsert)
    if: ${{ always() }}
    uses: actions/github-script@v7
    with:
      script: |
        const fs = require('fs');
        if (!fs.existsSync('pr-comment.md')) return;

        const body     = fs.readFileSync('pr-comment.md', 'utf8');
        const comments = await github.rest.issues.listComments({
          owner: context.repo.owner,
          repo:  context.repo.repo,
          issue_number: context.issue.number
        });

        const marker   = '<!-- SECSCORE_COMMENT -->';
        const existing = comments.data.find(c => (c.body || '').includes(marker));

        if (existing) {
          await github.rest.issues.updateComment({
            owner:      context.repo.owner,
            repo:       context.repo.repo,
            comment_id: existing.id,
            body
          });
        } else {
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo:  context.repo.repo,
            issue_number: context.issue.number,
            body
          });
        }

  - name: Fail job on SecScore FAIL
    if: ${{ steps.secscore.outputs.exit_code == '2' }}
    shell: bash
    run: exit 1
