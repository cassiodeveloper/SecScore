name: SecScore PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secscore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SecScore
        uses: cassiodeveloper/secscore@v1
        with:
          findings: examples/findings-review.json
          policy: policy/policy-pr.yml