name: SecScore PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secscore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Generate findings.json (placeholder)
        run: |
          cp examples/findings-clean.json findings.json

      - name: Run SecScore
        id: secscore
        run: |
          python3 -m secscore.cli.secscore pr \
            --findings findings.json \
            --policy policy/policy-pr.yml \
            --out pr-comment.md \
            --json-out secscore-result.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Label PR based on SecScore
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const label = 'secscore-review';

            if (!fs.existsSync('secscore-result.json')) {
              return;
            }

            const result = JSON.parse(fs.readFileSync('secscore-result.json', 'utf8'));

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const hasLabel = issue.data.labels.some(l => l.name === label);

            if (result.decision === 'REVIEW' && !hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label]
              });
            }

            if (result.decision !== 'REVIEW' && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label
              });
            }

      - name: Create SecScore status check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('secscore-result.json')) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "SecScore",
                head_sha: context.payload.pull_request.head.sha,
                status: "completed",
                conclusion: "failure",
                output: {
                  title: "SecScore FAIL",
                  summary: "SecScore did not produce a result file (secscore-result.json)."
                }
              });
              return;
            }

            const result = JSON.parse(fs.readFileSync('secscore-result.json', 'utf8'));
            const summary = fs.existsSync("pr-comment.md")
              ? fs.readFileSync("pr-comment.md", "utf8")
              : `SecScore ${result.decision} — Score ${result.score}/100`;

            const conclusion =
              result.decision === "PASS" ? "success" :
              result.decision === "REVIEW" ? "success" :
              "failure";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "SecScore",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion,
              output: {
                title: `SecScore ${result.decision}`,
                summary
              }
            });

      - name: Publish PR comment (upsert)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('pr-comment.md')) {
              return;
            }

            const body = fs.readFileSync('pr-comment.md', 'utf8');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const marker = "<!-- SECSCORE_COMMENT -->";
            const existing = comments.data.find(c => (c.body || "").includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail job on SecScore FAIL
        if: ${{ steps.secscore.outputs.exit_code == '2' }}
        run: exit 1